name: Codex marketplace Windows regression

on:
  push:
    branches: [validation/codex-marketplace-windows]
    paths:
      - .github/workflows/codex-marketplace-windows.yml
      - ci/codex-marketplace/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codex-marketplace-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  marketplace:
    runs-on: windows-2022
    timeout-minutes: 90
    env:
      CARGO_BUILD_JOBS: "4"
      CARGO_TERM_COLOR: never
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
      LIBSQLITE3_FLAGS: SQLITE_DISABLE_INTRINSIC
      RUST_BACKTRACE: "1"
      PYTHONUTF8: "1"
    steps:
      - name: Preserve bytes and allow long Git paths
        shell: pwsh
        run: |
          git config --global core.autocrlf false
          git config --global core.longpaths true
      - name: Checkout validation files
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          path: validation
          persist-credentials: false
          sparse-checkout: ci/codex-marketplace
      - name: Checkout pinned Codex source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          repository: openai/codex
          ref: 430a16799d90e296fb27b1e94f206023902b7e56
          path: codex
          persist-credentials: false
      - name: Install pinned Rust
        uses: dtolnay/rust-toolchain@d124f86f28ff42855784ff3319f48ac182c248f8
        with:
          toolchain: 1.99.1
      - name: Configure MSVC
        uses: ./codex/.github/actions/setup-msvc-env
        with:
          target: x86_64-pc-windows-msvc
      - name: Verify patch and run native Windows tests
        timeout-minutes: 75
        shell: pwsh
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/t
        run: python validation/ci/codex-marketplace/run_windows.py
      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: codex-marketplace-windows-${{ github.run_id }}-${{ github.run_attempt }}
          path: results/
          if-no-files-found: warn
          retention-days: 7
